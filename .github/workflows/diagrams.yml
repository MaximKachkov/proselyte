name: Check diagrams

on:
  pull_request:
  workflow_dispatch:

jobs:
  check-diagrams:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz make

      - name: Download PlantUML
        run: |
          curl -fL --retry 3 \
            https://github.com/plantuml/plantuml/releases/download/v1.2025.10/plantuml-1.2025.10.jar \
            -o /tmp/plantuml.jar

      - name: Show PlantUML version
        run: java -jar /tmp/plantuml.jar -version

      - name: Check PlantUML syntax
        run: make check-diagrams PLANTUML="java -jar /tmp/plantuml.jar"